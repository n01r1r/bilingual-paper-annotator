<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE@@</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #13273d;
      --ink: #222a34;
      --paper: #faf8f2;
      --translation: #f0ece2;
      --rule: #c8c2b7;
      --interface: "IBM Plex Sans", "Malgun Gothic", system-ui, sans-serif;
      --english: Lora, Georgia, "Times New Roman", serif;
      --korean: "Noto Serif KR", "Nanum Myeongjo", Batang, serif;
      --section-offset: 4.5rem;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: var(--section-offset); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem/1.6 var(--interface);
      overflow-wrap: anywhere;
    }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    a { color: #204b76; text-underline-offset: .15em; }
    .shell { width: min(100% - 2rem, 76rem); margin-inline: auto; }
    .skip-link {
      position: absolute;
      z-index: 3;
      left: 1rem;
      top: -10rem;
      padding: .5rem 1rem;
      background: var(--paper);
    }
    .skip-link:focus { top: 1rem; }
    .masthead { color: #fff; background: var(--navy); padding-block: 1.4rem; }
    .header-row { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 1rem; }
    h1 { margin: 0; font: 700 clamp(1.5rem, 4vw, 2.5rem)/1.2 var(--english); }
    .course { margin: .45rem 0 0; }
    .controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .controls[hidden] { display: none; }
    .controls label { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .controls button, .controls select {
      max-width: 100%;
      border: 1px solid var(--rule);
      border-radius: .25rem;
      color: var(--navy);
      background: var(--paper);
      padding: .35rem .55rem;
      font: inherit;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem 1rem;
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
      font-size: .875rem;
    }
    .legend li { display: flex; align-items: center; gap: .4rem; }
    .swatch { width: .8rem; height: .8rem; border-radius: .15rem; background: var(--highlight); flex: none; }
    .thesis { --highlight: #ffe486; --accent: #8d6900; --tint: #fff8df; }
    .concept { --highlight: #ffc8c3; --accent: #a63b37; --tint: #fff0ed; }
    .evidence { --highlight: #c5e2ff; --accent: #255d93; --tint: #edf5fd; }
    .concession { --highlight: #c2ebd1; --accent: #2c7151; --tint: #eef8f1; }
    .method { --highlight: #e3d3fa; --accent: #725197; --tint: #f6f0fd; }
    mark { background: var(--highlight, #ffe486); color: inherit; }
    .section-nav {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
    }
    .section-nav .shell { display: flex; gap: .25rem; overflow-x: auto; }
    .section-nav a {
      flex: none;
      padding: .65rem .75rem;
      color: var(--navy);
      text-decoration: none;
      white-space: nowrap;
    }
    .section-nav a:focus-visible { outline-offset: -3px; }
    .section-nav a[aria-current] { background: var(--translation); box-shadow: inset 0 -3px var(--navy); }
    main { padding-block: 1.5rem 3rem; }
    .paper-section + .paper-section, .overview { margin-top: 2.2rem; }
    h2, h3, h4, h5, h6 { color: var(--navy); line-height: 1.3; }
    .heading-ko { display: block; margin-top: .2em; font: 600 .85em/1.35 var(--korean); }
    .paragraph-pair {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: clamp(1rem, 3vw, 2.75rem);
      align-items: start;
      margin-block: 1.15rem;
    }
    .source { min-width: 0; }
    .source-en { font: 1.05rem/1.7 var(--english); }
    .source-en > :first-child, .source-ko > :first-child { margin-top: 0; }
    .source-en > :last-child, .source-ko > :last-child { margin-bottom: 0; }
    .source-ko {
      margin-top: .65rem;
      border-top: 1px solid var(--rule);
      border-left: 2px solid var(--rule);
      background: var(--translation);
      padding: .65rem .85rem;
      font: 1rem/1.7 var(--korean);
      word-break: keep-all;
    }
    .annotation {
      border-left: 3px solid var(--accent, #677181);
      background: var(--tint, #eeeff1);
      padding: .7rem .9rem;
      font-size: .92rem;
    }
    .annotation dl, .annotation dd { margin: 0; }
    .annotation dt { font-weight: 700; }
    .annotation dd + dt { margin-top: .4rem; }
    body[data-mode="both"] .annotation .analysis-ko {
      margin-top: .6rem;
      padding-top: .6rem;
      border-top: 1px solid var(--rule);
    }
    .overview { border-top: 1px solid var(--rule); padding-top: .75rem; }
    .overview li + li { margin-top: .65rem; }
    .overview p { margin-block: .4rem; }
    body[data-mode="en"] .analysis-ko,
    body[data-mode="en"][data-show-translation="false"] .source-ko,
    body[data-mode="en"][data-show-translation="false"] .heading-ko,
    body:not([data-mode="en"]) #translation-toggle,
    body[data-mode="ko"] .analysis-en,
    body[data-mode="ko"] .label-en,
    body:not([data-mode="ko"]) .label-ko { display: none; }
    .wide-content { overflow-x: auto; }
    .source-object { max-width: 100%; }
    img { max-width: 100%; height: auto; }
    math { font-family: "Cambria Math", "STIX Two Math", math; }
    @media (max-width: 48rem) {
      .paragraph-pair { grid-template-columns: minmax(0, 1fr); gap: .65rem; }
      .paragraph-pair + .paragraph-pair { margin-top: 1.45rem; }
    }
  </style>
</head>
<body data-mode="en" data-show-translation="false">
  <a class="skip-link" href="#paper">
    <span class="label-en">Skip to paper</span><span class="label-ko" lang="ko">논문 본문으로 이동</span>
  </a>
  <header class="masthead">
    <div class="shell">
      <div class="header-row">
        <div>
          <h1 lang="en">@@TITLE@@</h1>
          @@COURSE@@
        </div>
        <div class="controls" id="reader-controls" hidden>
          <label for="language">
            <span class="label-en">Language</span><span class="label-ko" lang="ko">언어</span>
            <select id="language">
              <option value="en" selected>English — Primary</option>
              <option value="both">English + 한국어</option>
              <option value="ko" lang="ko">한국어 — 보조</option>
            </select>
          </label>
          <button type="button" id="translation-toggle" aria-pressed="false">Show Korean translations</button>
        </div>
      </div>
      <ul class="legend">
        <li class="thesis"><span class="swatch" aria-hidden="true"></span><span class="analysis-en">Core thesis</span><span class="analysis-ko" lang="ko">핵심 주장</span></li>
        <li class="concept"><span class="swatch" aria-hidden="true"></span><span class="analysis-en">Key concepts</span><span class="analysis-ko" lang="ko">핵심 개념</span></li>
        <li class="evidence"><span class="swatch" aria-hidden="true"></span><span class="analysis-en">Evidence</span><span class="analysis-ko" lang="ko">근거</span></li>
        <li class="concession"><span class="swatch" aria-hidden="true"></span><span class="analysis-en">Concession / rebuttal</span><span class="analysis-ko" lang="ko">한계 인정과 반박</span></li>
        <li class="method"><span class="swatch" aria-hidden="true"></span><span class="analysis-en">Methods / assumptions</span><span class="analysis-ko" lang="ko">방법과 가정</span></li>
      </ul>
    </div>
  </header>
  <nav class="section-nav" aria-label="Paper sections">
    <div class="shell">
      @@SECTION_LINKS@@
      <a href="#argument-overview"><span class="label-en">Argument overview</span><span class="label-ko" lang="ko">논증 구조</span></a>
    </div>
  </nav>
  <main id="paper" class="shell" tabindex="-1">
    @@PAPER_SECTIONS@@
    <section class="overview" id="argument-overview">
      <h2><span class="analysis-en" lang="en">Argument overview</span> <span class="analysis-ko" lang="ko">논증 구조</span></h2>
      @@ARGUMENT_OVERVIEW@@
    </section>
  </main>
  <script>
    const body = document.body;
    const language = document.querySelector("#language");
    const translation = document.querySelector("#translation-toggle");
    const sectionNav = document.querySelector(".section-nav");
    const links = Array.from(sectionNav.querySelectorAll('a[href^="#"]'));
    const sections = links.map(link => document.getElementById(link.hash.slice(1)));

    function setLanguage() {
      const korean = language.value === "ko";
      body.dataset.mode = language.value;
      document.documentElement.lang = korean ? "ko" : "en";
      sectionNav.setAttribute("aria-label", korean ? "논문 섹션" : "Paper sections");
    }

    language.addEventListener("change", setLanguage);
    translation.addEventListener("click", () => {
      const shown = body.dataset.showTranslation === "false";
      body.dataset.showTranslation = String(shown);
      translation.setAttribute("aria-pressed", String(shown));
    });
    document.querySelector("#reader-controls").hidden = false;
    setLanguage();

    function updateCurrentSection() {
      const offset = sectionNav.getBoundingClientRect().height + 16;
      let current = 0;
      sections.forEach((section, index) => {
        if (section && section.getBoundingClientRect().top <= offset) current = index;
      });
      if (window.scrollY > 0 && Math.ceil(window.scrollY + innerHeight) >= document.documentElement.scrollHeight) {
        current = links.length - 1;
      }
      links.forEach((link, index) => {
        if (index === current) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
    }

    let framePending = false;
    function scheduleSectionUpdate() {
      if (framePending) return;
      framePending = true;
      requestAnimationFrame(() => {
        framePending = false;
        updateCurrentSection();
      });
    }

    new ResizeObserver(() => {
      const offset = sectionNav.getBoundingClientRect().height + 12;
      document.documentElement.style.setProperty("--section-offset", `${offset}px`);
      scheduleSectionUpdate();
    }).observe(sectionNav);
    window.addEventListener("scroll", scheduleSectionUpdate, { passive: true });
    window.addEventListener("resize", scheduleSectionUpdate);
    language.addEventListener("change", scheduleSectionUpdate);
    translation.addEventListener("click", scheduleSectionUpdate);
    scheduleSectionUpdate();
  </script>
</body>
</html>
